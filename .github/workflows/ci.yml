name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend syntax + import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Byte-compile
        run: python -m compileall -q backend/app
      - name: API contract tests
        run: pytest backend/tests -q
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Upload built SPA
        uses: actions/upload-artifact@v4
        with:
          name: spa
          path: backend/static
          retention-days: 3

  smoke:
    name: UI smoke (jsdom)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          npm ci --prefix frontend
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n1
      - name: Build the SPA the server will serve
        run: npm run build --prefix frontend
      - name: Start the API
        run: |
          cd backend && PYTHONPATH=. python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1
          done
      - name: Walk the UI (creates its own sample project)
        run: |
          set -o pipefail
          if npm run smoke --prefix frontend 2>&1 | tee /tmp/smoke.log; then
            exit 0
          fi
          echo "───── smoke output ─────"; cat /tmp/smoke.log
          summary=$(grep -E '^(✅|❌|⏭️|⚠️|   •)' /tmp/smoke.log | tr '\n' '|' | tail -c 900)
          echo "::error::UI smoke failed: ${summary}"
          exit 1
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: /tmp/smoke.log
          if-no-files-found: ignore
          retention-days: 3

  docker:
    name: Docker image (deployability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image Render would build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
